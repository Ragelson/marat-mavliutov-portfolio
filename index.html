<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- title, description и Open Graph подставляет vite-plugins/site-meta.ts из src/config/site.ts -->
    <script>
      // Тема выставляется до отрисовки, чтобы не было вспышки неправильной темы.
      // Ключ 'theme' совпадает с THEME_STORAGE_KEY в src/hooks/useTheme.ts.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
